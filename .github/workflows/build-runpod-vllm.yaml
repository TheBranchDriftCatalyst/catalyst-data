name: Build RunPod vLLM Image
on:
  push:
    branches: [main]
    paths:
      - 'packages/catalyst-runpod-vllm/**'
  pull_request:
    paths:
      - 'packages/catalyst-runpod-vllm/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Read version
        run: echo "VERSION=$(cat packages/catalyst-runpod-vllm/VERSION | tr -d '[:space:]')" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: ./packages/catalyst-runpod-vllm
          file: ./packages/catalyst-runpod-vllm/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/catalyst-runpod-vllm:latest
            ghcr.io/${{ env.OWNER_LC }}/catalyst-runpod-vllm:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/catalyst-runpod-vllm:${{ github.sha }}
          cache-from: type=gha,scope=runpod-vllm
          cache-to: type=gha,scope=runpod-vllm,mode=max
