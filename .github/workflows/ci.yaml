name: Catalyst Data CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  lint-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/media-ingest/viewer-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/media-ingest/viewer-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -e libs/catalyst-contracts-core
          pip install -e libs/catalyst-llm-contract-mcp
          pip install -e libs/catalyst-langgraph-aio
          pip install -e libs/dagster-io
          pip install -e packages/congress-data
          pip install -e packages/media-ingest
          pip install -e packages/open-leaks
          pip install -e packages/knowledge-graph
          pip install pytest pytest-cov
      - run: >-
          pytest --tb=short
          --ignore=packages/media-ingest/tests/test_transcription_qa.py
          --ignore=packages/media-ingest/tests/integration
          --ignore=packages/congress-data/tests/integration

  build:
    needs: [test]
    strategy:
      matrix:
        app: [congress-data, media-ingest, open-leaks, knowledge-graph, knowledge-graph-api]
    uses: ./.github/workflows/build-image.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

