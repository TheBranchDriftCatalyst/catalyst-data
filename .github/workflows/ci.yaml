name: Catalyst Data CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/media-ingest/viewer-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/media-ingest/viewer-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -e libs/catalyst-contracts-core
          pip install -e libs/dagster-io
          pip install -e packages/congress-data
          pip install -e packages/media-ingest
          pip install -e packages/open-leaks
          pip install -e packages/knowledge-graph
          pip install -e packages/data-explorer
          pip install pytest pytest-cov
      - run: pytest --tb=short --ignore=packages/media-ingest/tests/test_transcription_qa.py

  build:
    needs: [lint-python, lint-frontend, test]
    strategy:
      matrix:
        app: [congress-data, media-ingest, open-leaks, knowledge-graph, data-explorer]
    uses: ./.github/workflows/build-image.yaml
    with:
      app: ${{ matrix.app }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  build-gpu:
    needs: [lint-python, lint-frontend, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/media-ingest/Dockerfile.gpu
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/media-ingest:gpu
            ghcr.io/${{ env.OWNER_LC }}/media-ingest:gpu-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
