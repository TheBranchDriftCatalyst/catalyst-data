[project]
name = "catalyst-data-tests"
version = "0.1.0"
description = "Test harness for catalyst-data Dagster pipelines"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "dagster>=1.9",
    "pydantic>=2.0",
    "intervaltree>=3.1",
    # rdflib lives in packages/knowledge-graph but the workspace test harness
    # isn't a member of that package — declare it here so the n10s/Turtle-star
    # round-trip tests resolve from the root .venv.
    "rdflib>=7.1",
]
# Bench-side optional deps — DuckDB writer + S3 archive for the audit
# log (see libs/dagster-io/src/dagster_io/bench/event_store.py, CD-jzkg).
bench = ["fastapi>=0.110", "uvicorn>=0.27"]
# local-embed: sentence-transformers + MPS for Qwen3-Embedding-8B
# (M5 Max / Apple Silicon). See dagster-io[local-embed] for the full dep set.
local-embed = ["sentence-transformers>=3.0", "torch>=2.4", "transformers>=4.45", "pyarrow>=17.0"]
# unsloth: local fine-tuning consumer for Phase 3 SFT/DPO JSONL — see
# scripts/training/unsloth_finetune.py + CD-sduv. Heavy + GPU-only; opt-in only.
unsloth = ["unsloth>=2024.10", "trl>=0.11", "transformers>=4.45", "peft>=0.13", "bitsandbytes>=0.43", "datasets>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/congress-data/tests", "packages/media-ingest/tests", "packages/open-leaks/tests"]
addopts = "--import-mode=importlib"
markers = [
    "llm: requires LLM API key (OPENAI_API_KEY or LLM_API_KEY)",
    "slow: long-running test",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["libs", "packages"]
# .claude/worktrees/ holds temporary subagent scratch worktrees — full
# copies of the repo with their own pyproject.toml files that would
# trip ruff's config discovery and double-count every error.
extend-exclude = [".claude", ".beads", "packages/catalyst-data-ui/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — we have a 120 limit, but some long strings/URLs legitimately exceed
    "E402",   # module level import not at top — dagster_io code locations deliberately call
              # configure_logging() / start_metrics_server() BEFORE importing dagster
    "B008",   # function calls in default args — pydantic Field(default=...) and dagster
              # AssetIn(...) patterns use this idiomatically
]

[tool.ruff.lint.isort]
known-first-party = ["dagster_io", "catalyst_contracts_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
