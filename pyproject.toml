[project]
name = "catalyst-data-tests"
version = "0.1.0"
description = "Test harness for catalyst-data Dagster pipelines"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov", "dagster>=1.9", "pydantic>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/congress-data/tests", "packages/media-ingest/tests", "packages/open-leaks/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["libs", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dagster_io", "catalyst_contracts_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
