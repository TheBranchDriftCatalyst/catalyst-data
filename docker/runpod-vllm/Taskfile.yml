version: "3"

vars:
  REGISTRY: ghcr.io/thebranchdriftcatalyst
  IMAGE_NAME: runpod-vllm
  HF_TOKEN_FILE: "{{.HOME}}/.cache/huggingface/token"

tasks:
  # ── Single-model builds ─────────────────────────────────────────────

  build:gemma-31b:
    desc: Build image with google/gemma-4-31B-it baked in
    cmds:
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg MODEL_NAME="google/gemma-4-31B-it" \
          --build-arg MAX_MODEL_LEN=8192 \
          --secret id=HF_TOKEN,src={{.HF_TOKEN_FILE}} \
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:gemma4-31b-it \
          .

  build:gemma-26b-moe:
    desc: Build image with google/gemma-4-26B-A4B-it baked in
    cmds:
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg MODEL_NAME="google/gemma-4-26B-A4B-it" \
          --build-arg MAX_MODEL_LEN=8192 \
          --secret id=HF_TOKEN,src={{.HF_TOKEN_FILE}} \
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:gemma4-26b-a4b-it \
          .

  build:qwen3-30b:
    desc: Build image with Qwen3-30B-A3B baked in
    cmds:
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg MODEL_NAME="Qwen/Qwen3-30B-A3B-Instruct-2507" \
          --build-arg MAX_MODEL_LEN=8192 \
          --secret id=HF_TOKEN,src={{.HF_TOKEN_FILE}} \
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:qwen3-30b-a3b \
          .

  build:dolphin-24b:
    desc: Build image with dolphin-mistral-24b baked in
    cmds:
      - |
        DOCKER_BUILDKIT=1 docker build \
          --build-arg MODEL_NAME="dphn/dolphin-mistral-24b-venice-edition" \
          --build-arg MAX_MODEL_LEN=8192 \
          --secret id=HF_TOKEN,src={{.HF_TOKEN_FILE}} \
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:dolphin-24b \
          .

  # ── Base image (no model baked, uses RunPod cache) ──────────────���───

  build:base:
    desc: Build base image (model downloads at runtime via RunPod cache)
    cmds:
      - |
        DOCKER_BUILDKIT=1 docker build \
          -t {{.REGISTRY}}/{{.IMAGE_NAME}}:base \
          .

  # ── Push ────────────────────────────────────────────────────────────

  push:
    desc: Push all tagged images to GHCR
    cmds:
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:gemma4-31b-it
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:gemma4-26b-a4b-it
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:qwen3-30b-a3b
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:dolphin-24b
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:base

  push:gemma-31b:
    desc: Push just the gemma-31b image
    cmds:
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:gemma4-31b-it

  push:gemma-26b-moe:
    desc: Push just the gemma-26b-moe image
    cmds:
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:gemma4-26b-a4b-it

  # ── Login ───────────────────────────────────────────────────────────

  login:
    desc: Authenticate to GHCR
    cmds:
      - echo "$GITHUB_TOKEN" | docker login ghcr.io -u TheBranchDriftCatalyst --password-stdin
