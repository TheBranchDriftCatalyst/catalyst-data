[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-ingest"
version = "0.1.0"
description = "Media file processing pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "dagster-aws>=0.25",
    "dagster-k8s>=0.25",
    "dagster-postgres>=0.25",
    "dagster-io",
    "boto3>=1.34",
    "pydantic>=2.0",
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3,<4",
    "torch>=2.6",
    "torchaudio>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
openvino = [
    "openvino-genai>=2025.4",
    "librosa>=0.10",
    "soundfile>=0.12",
]
dev = [
    "dagster-webserver>=1.9",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_ingest"]
