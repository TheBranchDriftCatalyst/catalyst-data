[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-ingest"
version = "0.1.0"
description = "Media file processing pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-aws>=0.29",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "boto3>=1.35",
    "pydantic>=2.9",
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "torchcodec>=0.11",
    "torch>=2.11",
    "torchaudio>=2.11",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
openvino = [
    "openvino-genai>=2025.4",
    "librosa>=0.11",
    "soundfile>=0.13",
]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_ingest"]
