[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-ingest"
version = "0.1.0"
description = "Media file processing pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-aws>=0.29",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "catalyst-contracts-core",
    "catalyst-exgraph",
    "boto3>=1.35",
    "pydantic>=2.9",
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "torchcodec>=0.11",
    "torch>=2.11",
    "torchaudio>=2.11",
    "soundfile>=0.13",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
openvino = [
    "openvino-genai>=2025.4",
    "librosa>=0.11",
    "soundfile>=0.13",
]
mlx = [
    # Apple Silicon Metal-accelerated Whisper. Install on macOS arm64 only.
    "mlx-whisper>=0.4",
]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    # moto-server is the e2e S3 mock — Playwright globalSetup boots it
    # alongside Vite + uvicorn so the FastAPI viewer talks to a real
    # boto3-compatible S3 (seeded from corpora) without needing MinIO.
    "moto[server]>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_ingest"]

# Wave 1, Step 4 (bead llm-g0b): wire catalyst-exgraph + catalyst-contracts-core
# as editable workspace deps so the asset_factory/extraction wrapper resolves the
# same shared packages as libs/dagster-io.
[tool.uv.sources]
catalyst-contracts-core = { path = "../../../catalyst-llm/packages/catalyst-contracts-core", editable = true }
catalyst-exgraph = { path = "../../../catalyst-llm/packages/catalyst-exgraph", editable = true }
