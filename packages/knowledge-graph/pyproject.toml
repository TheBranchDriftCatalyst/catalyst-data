[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Knowledge graph platinum layer — cross-source entity resolution and assertion graph"
requires-python = ">=3.15.0"
dependencies = [
    "dagster>=1.13.26",
    "dagster-k8s>=0.29.26",
    "dagster-postgres>=0.29.26",
    "dagster-io",
    "catalyst-contracts-core",
    "catalyst-exgraph",
    "pydantic>=2.14.1",
    "neo4j>=5.28.8",
    "psycopg[binary]>=3.3.6",
    # RDF / RDF-star round-trip support — the assertion graph lives primary
    # in Neo4j, but we export Turtle-star via the n10s plugin for geo-KG
    # interop and federation. rdflib is the parser/serializer.
    "rdflib>=7.6.0",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13.26",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    # Embedded RDF-star store for tests — lets us parse Turtle-star from
    # n10s exports without spinning up a separate triplestore.
    "pyoxigraph>=0.5.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_graph"]

# Wave 1, Step 4 (bead llm-g0b): wire catalyst-exgraph + catalyst-contracts-core
# as editable workspace deps so the asset_factory/extraction wrapper resolves the
# same shared packages as libs/dagster-io.
[tool.uv.sources]
catalyst-contracts-core = { path = "../../../catalyst-llm/packages/catalyst-contracts-core", editable = true }
catalyst-exgraph = { path = "../../../catalyst-llm/packages/catalyst-exgraph", editable = true }
