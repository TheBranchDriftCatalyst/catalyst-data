[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Knowledge graph platinum layer — cross-source entity resolution and assertion graph"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "pydantic>=2.9",
    "neo4j>=5.28",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_graph"]
