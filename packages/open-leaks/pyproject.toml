[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-leaks"
version = "0.1.0"
description = "Open-source leaked documents pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "pydantic>=2.9",
    "requests>=2.32",
    "httpx>=0.28",
    "pymupdf>=1.25",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_leaks"]
