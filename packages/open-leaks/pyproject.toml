[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-leaks"
version = "0.1.0"
description = "Open-source leaked documents pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "catalyst-contracts-core",
    "catalyst-exgraph",
    # AMR-as-spine extraction path — AmrToAssertionNode calls amrlib.
    # Bundled here because open-leaks runs AMR projection on cable
    # chunks; fail loud at install vs at first parse().
    "amrlib>=0.8.1",
    "pydantic>=2.9",
    "requests>=2.32",
    "httpx>=0.28",
    "pymupdf>=1.25",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_leaks"]

# Wave 1, Step 4 (bead llm-g0b): wire catalyst-exgraph + catalyst-contracts-core
# as editable workspace deps so the asset_factory/extraction wrapper resolves the
# same shared packages as libs/dagster-io.
[tool.uv.sources]
catalyst-contracts-core = { path = "../../../catalyst-llm/packages/catalyst-contracts-core", editable = true }
catalyst-exgraph = { path = "../../../catalyst-llm/packages/catalyst-exgraph", editable = true }
