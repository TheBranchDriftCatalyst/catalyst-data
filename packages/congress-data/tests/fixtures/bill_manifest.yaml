# Bill partitions iterated by `task bench:chunks:regen:congress`.
# Add additional bill_ids to grow the benchmark corpus. Each must be a
# valid Congress.gov partition key (format: <congress>-<bill_type>-<number>).
# Materialization requires CONGRESS_API_KEY (live API call).
#
# Selection goals (CD-s4em): cover all 6 bill types (hr, s, hres, sres,
# hjres, sjres), 12+ distinct policy_areas (Congress.gov classification),
# mix small/large, recent congresses biased toward 119 > 118 > 117.
# Each comment cites the bill's actual `policyArea.name` from the
# Congress.gov API so the corpus diversity is observable, not just claimed.

# `seed_subset:` is what `task seed:congress` materializes — a tiny
# variety pick (4 distinct bill types, 5 distinct policy areas, sizes
# from small ceremonial to huge omnibus, across 3 congresses) so a
# fresh `tilt up` has real silver chunks to render in the SPA without
# burning through the whole 30-bill manifest.
seed_subset:
  - "119-hres-1"        # Congress — small procedural (House rules package), validates the unpartitioned-ish small case
  - "119-s-146"         # Science, Technology, and Communications — TAKE IT DOWN Act (AI deepfake non-consensual imagery, signed into law May 2025)
  - "119-hjres-25"      # Taxation — CRA disapproval (small joint resolution, niche policy area)
  - "118-hr-3935"       # Transportation and Public Works — FAA Reauthorization Act of 2024 (medium-large, technical regulatory text)
  - "117-hr-5376"       # Economics and Public Finance — Inflation Reduction Act (huge omnibus; stresses chunking + spans many sub-areas)

bills:
