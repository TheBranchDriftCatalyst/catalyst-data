[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "congress-data"
version = "0.1.0"
description = "Congress.gov data pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "catalyst-contracts-core",
    "catalyst-exgraph",
    "pydantic>=2.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/congress_data"]

# Wave 1, Step 4 (bead llm-g0b): wire catalyst-exgraph + catalyst-contracts-core
# as editable workspace deps so the asset_factory/extraction wrapper resolves the
# same shared packages as libs/dagster-io. Path is relative to this pyproject.toml
# (packages/congress-data/pyproject.toml → ../../../catalyst-llm/packages/...).
[tool.uv.sources]
catalyst-contracts-core = { path = "../../../catalyst-llm/packages/catalyst-contracts-core", editable = true }
catalyst-exgraph = { path = "../../../catalyst-llm/packages/catalyst-exgraph", editable = true }
