[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "congress-data"
version = "0.1.0"
description = "Congress.gov data pipeline — Dagster code location"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-k8s>=0.29",
    "dagster-postgres>=0.29",
    "dagster-io",
    "pydantic>=2.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/congress_data"]
