version: "0.1.1"
name: "catalyst-data"
description: "38-asset knowledge graph construction platform with MCP-contracted LLM extraction, dual-write KG (PostgreSQL+pgvector + Neo4j), GPU-accelerated transcription, and cross-source entity resolution running on a 5-node Talos cluster"
repo_url: "https://github.com/TheBranchDriftCatalyst/catalyst-data"
status: "active"

tech_stack:
  languages:
    - "python"
  frameworks:
    - "dagster"
    - "pydantic"
    - "streamlit"
    - "langgraph"
  tools:
    - "docker"
    - "kubernetes"
    - "argocd"
    - "postgresql"
    - "neo4j"
    - "minio"
    - "prometheus"
    - "openai"
    - "tilt"
    - "kustomize"
  ml:
    - "whisper"
    - "openvino"
    - "faster-whisper"
    - "pyannote"
    - "spacy"
    - "sentence-transformers"

groups:
  - "catalyst-core"
  - "data-engineering"
  - "knowledge-graph"
  - "ai-ml"

badges:
  stars: true
  issues: true
  prs: true
  license: true

highlights:
  - "38 Dagster assets across 4 code locations (12 congress, 10 media, 13 open-leaks, 3 knowledge-graph) with Bronze/Silver/Gold/Platinum medallion architecture"
  - "3-package LLM contract validation system with MCP-enforced structured output, 9 ConfigMap-mounted prompt templates, and 198 tests at 97% coverage"
  - "GPU-accelerated transcription: dual backend (OpenVINO + faster-whisper) with automatic CPU fallback"
  - "Speaker diarization with pyannote + word-level alignment"
  - "LLM-based NER and qualified S-P-O assertion extraction with negation/hedge detection"
  - "Cross-source entity resolution (EDC framework) across 4 domains"
  - "Dual-write knowledge graph: PostgreSQL+pgvector + Neo4j"
  - "22 Prometheus metrics across 8 subsystems with 32 Kubernetes manifests"
  - "QSV AV1 hardware video transcoding for ultra compression"
  - "React SPA viewer-ui with HITL annotation, benchmark dashboard, S3 explorer"

domains:
  - congress-data
  - open-leaks
  - media-ingest
  - knowledge-graph

infrastructure:
  cluster: "talos-homelab"
  gpu: "Intel Arc A380 (i915)"
  storage: ["MinIO S3", "PostgreSQL+pgvector", "Neo4j"]
  observability: ["Prometheus", "Grafana"]
  cicd: "ArgoCD"
  dev: "Tiltfile"

architecture:
  pattern: "Medallion lakehouse"
  orchestrator: "Dagster"
  partitioning: "Dynamic per-file"
  prompts: "9 ConfigMap-mounted Jinja2 templates"
