---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-data-homepage
  labels:
    app: catalyst-data-homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalyst-data-homepage
  template:
    metadata:
      labels:
        app: catalyst-data-homepage
    spec:
      serviceAccountName: catalyst-data-homepage
      initContainers:
        - name: copy-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              cp /config-source/* /app/config/
              mkdir -p /app/config/logs
              chmod -R 777 /app/config
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /app/config
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config-source
          configMap:
            name: catalyst-data-homepage-config
        - name: config
          emptyDir: {}
