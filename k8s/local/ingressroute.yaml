---
# Traefik IngressRoutes — local (k3d) overlay.
# Access via: http://<service>.local.lan
#
# Add to /etc/hosts on the dev workstation:
#   127.0.0.1  dagster.local.lan neo4j.local.lan media-explorer.local.lan \
#              kg-graphql.local.lan data-hub.local.lan
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dagster
  labels:
    app: dagster
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dagster.local.lan`)
      kind: Rule
      services:
        - name: dagster-webserver
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: neo4j-browser
  labels:
    app: neo4j
    app.kubernetes.io/part-of: catalyst-data
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`neo4j.local.lan`)
      kind: Rule
      services:
        - name: neo4j
          port: 7474
---
# TCP route for Neo4j Bolt protocol. Requires Traefik to have a 'bolt'
# entrypoint configured (the prod cluster does; k3d may not by default —
# port-forward 7687 instead if this doesn't route).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: neo4j-bolt
  labels:
    app: neo4j
    app.kubernetes.io/part-of: catalyst-data
spec:
  entryPoints:
    - bolt
  routes:
    - match: HostSNI(`*`)
      services:
        - name: neo4j
          port: 7687
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: media-explorer
  labels:
    app: media-ingest
    app.kubernetes.io/part-of: catalyst-data
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`media-explorer.local.lan`)
      kind: Rule
      services:
        - name: media-ingest
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knowledge-graph-api
  labels:
    app: knowledge-graph-api
    app.kubernetes.io/part-of: catalyst-data
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kg-graphql.local.lan`)
      kind: Rule
      services:
        - name: knowledge-graph-api
          port: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catalyst-data-homepage
  annotations:
    gethomepage.dev/enabled: "false"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`data-hub.local.lan`)
      kind: Rule
      services:
        - name: catalyst-data-homepage
          port: 3000
