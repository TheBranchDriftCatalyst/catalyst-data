---
# Overlay: local (k3d catalyst-dev cluster) — CD-48tr scope
#
# Cluster context: k3d-catalyst-dev (shared via ../../infra/k3d/)
# Namespace:       catalyst-data
#
# CD-48tr (May 2026) moved the data-layer services (MinIO + Neo4j) from
# docker-compose.dev.yml into this k3d-targeted overlay. Dagster code
# locations (congress-data, media-ingest, open-leaks, knowledge-graph)
# still run as host-Python processes via `task dev` — they reach the
# in-cluster services via port-forwards Tilt exposes on localhost:
#   MinIO   :9000 / :9001
#   Neo4j   :7474 (HTTP) / :7687 (Bolt)
#
# This overlay deliberately references individual files in ../base/ to
# build the minimum set; that triggers kustomize's load-restrictor
# security check, so Tilt's kustomize() call in ../../Tiltfile passes
# `--load-restrictor=LoadRestrictionsNone` to disable it. Tilt itself
# is local dev-only so the restrictor isn't load-bearing here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalyst-data

resources:
  # Namespace decl from base.
  - ../base/namespace.yaml
  # Neo4j Deployment + PVC + Service (local-path storage class works
  # in k3d) plus the one-shot n10s.graphconfig.init() Job.
  - ../base/platform/neo4j.yaml
  - ../base/platform/neo4j-n10s-init.yaml
  # MinIO Deployment + PVC + Service + bucket-init Job (local-only —
  # talos prod runs MinIO Operator Tenant in its own namespace, so this
  # local manifest doesn't live in ../base/).
  - minio.yaml
  # Single source of truth for local-dev runtime config (S3 endpoints,
  # media discovery paths, chunking knobs, embedding defaults). Read
  # by the Tiltfile via read_yaml() and piped into the dagster-dev
  # local_resource's serve_env. Future containerized rail mounts this
  # directly via envFrom + configMapRef. Secrets stay in .envrc.cluster.
  - dagster-dev-config.yaml
