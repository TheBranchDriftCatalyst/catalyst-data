---
# Local-dev runtime config for Dagster code locations (CD-48tr).
#
# Holds the local-development equivalents of the runtime knobs that
# talos prod ships via ExternalSecret + ConfigMap+envFrom in the
# per-domain Deployments (see k8s/base/<domain>/deployment.yaml).
#
# Source of truth for committed (non-secret) local-dev config. The
# Tiltfile reads this ConfigMap (via read_yaml(...) at Tiltfile load
# time, NOT a kubectl shell-out — read_yaml is Starlark-native and
# avoids a dependency on a running cluster) and passes the data into
# the dagster-dev local_resource via ``serve_env={...}``.
#
# Secrets (LLM_API_KEY, CONGRESS_API_KEY, HF_TOKEN) stay in
# .envrc.cluster — gitignored, refreshed by
# ./scripts/ops/pull-dev-secrets.sh from the catalyst-cluster secrets.
#
# When containerizing the code locations in a future CD-48tr follow-on,
# this ConfigMap can be mounted via envFrom directly — same data, same
# keys, no code change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-dev-config
  labels:
    app.kubernetes.io/name: dagster-dev-config
    app.kubernetes.io/part-of: catalyst-data
data:
  # ── Local k3d MinIO (override .envrc.cluster's prod values) ─────
  DAGSTER_S3_ENDPOINT_URL: "http://localhost:9000"
  DAGSTER_S3_ACCESS_KEY: "minio"
  DAGSTER_S3_SECRET_KEY: "minio123"
  DAGSTER_S3_BUCKET: "dagster"

  # ── Catalyst data root ─────────────────────────────────────────
  # Single switch that mirrors the prod NFS layout on the dev host.
  # Prod: CATALYST_DATA_ROOT=/data (NFS PVC); dev: a writable local
  # mirror with the same {metube,tubesync,whisper-models} subdirs.
  # Tilt resolves this relative path to absolute and provisions the
  # subdirs (symlinking test fixtures into metube/tubesync) at startup.
  CATALYST_DATA_ROOT: ".dev-data"

  # ── Prompt registry ────────────────────────────────────────────
  # No PROMPT_REGISTRY_DIR here — in prod each container sets its own
  # (one container = one domain). Dev runs all three code locations
  # in one process; resolve_prompt_dir() falls back to
  # k8s/base/<domain>/prompts per call via the domain argument.

  # ── Whisper backend — Mac default ──────────────────────────────
  # talos uses openvino (Intel GPU); on Apple Silicon prefer
  # mlx-whisper (Metal) — but mlx is an optional install
  # (pyproject.toml::media-ingest[mlx]). faster-whisper is the
  # pure-CPU fallback that works without extras.
  WHISPER_BACKEND: "faster-whisper"

  # ── Chunking ───────────────────────────────────────────────────
  CHUNK_SIZE: "2000"
  CHUNK_OVERLAP: "200"

  # ── LLM (LiteLLM proxy default — keys come from .envrc.cluster) ─
  # Pick the SOTA-tier model at dev-friendly pricing. The local
  # LiteLLM proxy registry today has:
  #   - claude-opus-4-7              (SOTA reasoning, $$$ — overkill for iter)
  #   - claude-haiku-4-5-20251001    (fast + cheap, NOT SOTA-tier)
  #   - gpt-5.5                      (flagship, dev-priced — best balance)
  #   - o3-mini                      (reasoning, slow, mid-priced)
  # Pick gpt-5.5 — flagship intelligence + 1M context window.
  # The omnibus appropriations bill (117-hr-2617) tokenises to ~1.05M;
  # o3-mini (200K context) and Haiku (200K) both refused. gpt-5.5 fits
  # + is SOTA-tier on legal-text composition. Switch to gpt-5.4-mini
  # for cost-sensitive iterative work once talos00 has applied the
  # litellm ConfigMap.
  LLM_MODEL: "gpt-5.5"

  # bill_claims chunking knobs. Tune these per LLM_MODEL — bigger
  # context models can pack more bill text per call (fewer calls per
  # bill, lower per-bill cost). See assets/bill_claims.py header for
  # the recommended pairing per model. Leave unset for the gpt-5.5
  # defaults baked into the asset.
  # BILL_CLAIMS_TOKEN_BUDGET:           "700000"   # input tokens per call
  # BILL_CLAIMS_SINGLE_CALL_THRESHOLD:  "200000"   # skip chunking under this
  # BILL_CLAIMS_CHARS_PER_TOKEN:        "4"        # estimation ratio
  LLM_BASE_URL: "http://litellm.talos00/v1"

  # ── Embeddings ─────────────────────────────────────────────────
  EMBEDDING_PROVIDER: "litellm"
  EMBEDDING_MODEL: "text-embedding-3-small"
  # EMBEDDING_BASE_URL + EMBEDDING_API_KEY default to LLM_* in the
  # Tiltfile (Starlark default-merge logic before serve_env).
