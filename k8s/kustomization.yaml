---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalyst-data

resources:
  # Namespace
  - namespace.yaml
  # Secrets (consolidated — one set for entire namespace)
  - secrets/externalsecret-s3.yaml
  - secrets/externalsecret-congress.yaml
  - secrets/externalsecret-llm.yaml
  - secrets/externalsecret-hf.yaml
  # Storage
  - storage/nfs-media-volumes.yaml
  - storage/whisper-models-pvc.yaml
  - storage/model-cache-pvc.yaml
  # Platform (webserver, daemon, postgres)
  - platform/rbac.yaml
  - platform/pvc.yaml
  - platform/postgres.yaml
  - platform/dagster-instance.yaml
  - platform/workspace.yaml
  - platform/deployment.yaml
  - platform/service.yaml
  - platform/ingressroute.yaml
  # Knowledge graph infrastructure
  - platform/postgres-knowledge.yaml
  - platform/neo4j.yaml
  - platform/neo4j-ingressroute.yaml
  - platform/neo4j-n10s-init.yaml
  # Code locations
  - congress-data/deployment.yaml
  - congress-data/service.yaml
  - media-ingest/deployment.yaml
  - media-ingest/service.yaml
  - media-ingest/ingressroute.yaml
  - open-leaks/deployment.yaml
  - open-leaks/service.yaml
  - knowledge-graph/deployment.yaml
  - knowledge-graph/service.yaml
  # Knowledge Graph GraphQL API (Node/Apollo + @neo4j/graphql over Neo4j)
  - knowledge-graph-api/deployment.yaml
  - knowledge-graph-api/service.yaml
  - knowledge-graph-api/ingressroute.yaml
  # Homepage (data platform dashboard)
  - homepage/deployment.yaml
  - homepage/service.yaml
  - homepage/ingressroute.yaml
  - homepage/rbac.yaml
  - homepage/configmap.yaml
  # Monitoring (ServiceMonitor, PrometheusRule, Grafana Dashboard)
  - monitoring/servicemonitor.yaml
  - monitoring/prometheusrule.yaml
  - monitoring/grafana-dashboard.yaml

configMapGenerator:
  - name: open-leaks-prompts
    files:
      - mention_extraction.prompt=open-leaks/prompts/mention_extraction.prompt
      - proposition_extraction.prompt=open-leaks/prompts/proposition_extraction.prompt
  - name: congress-data-prompts
    files:
      - mention_extraction.prompt=congress-data/prompts/mention_extraction.prompt
      - proposition_extraction.prompt=congress-data/prompts/proposition_extraction.prompt
  - name: media-ingest-prompts
    files:
      - mention_extraction.prompt=media-ingest/prompts/mention_extraction.prompt
      - proposition_extraction.prompt=media-ingest/prompts/proposition_extraction.prompt
