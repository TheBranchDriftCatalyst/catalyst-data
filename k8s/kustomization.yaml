---
# This file is kept for back-compat with anything that runs
#   kustomize build k8s/
# at the repo root (Argo CD currently points here). New callers should
# target an explicit env overlay:
#
#   kustomize build k8s/local       # k3d dev cluster
#   kustomize build k8s/talos00     # production homelab
#
# Recommended: update talos-homelab Argo CD Application
#   infrastructure/base/argocd/applications/catalyst-data.yaml
# to point at `path: k8s/talos00` (mirroring catalyst-llm).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - talos00
