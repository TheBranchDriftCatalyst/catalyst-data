---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-instance
  labels:
    app: dagster
    app.kubernetes.io/name: dagster
data:
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          username:
            env: DAGSTER_POSTGRES_USER
          password:
            env: DAGSTER_POSTGRES_PASSWORD
          hostname:
            env: DAGSTER_POSTGRES_HOST
          db_name:
            env: DAGSTER_POSTGRES_DB
          port:
            env: DAGSTER_POSTGRES_PORT

    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator
      config:
        max_concurrent_runs: 10
        tag_concurrency_limits:
          - key: "gpu"
            limit: 5

    run_launcher:
      module: dagster_k8s
      class: K8sRunLauncher
      config:
        instance_config_map: dagster-instance
        service_account_name: dagster
        load_incluster_config: true
        job_namespace: catalyst-data
        run_k8s_config:
          container_config:
            image_pull_policy: Always
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
            env:
              # CloudNativePG read-write endpoint (TALOS-zjh0). Credentials come from
              # the CNPG-generated dagster-postgres-app secret, not a literal.
              - name: DAGSTER_POSTGRES_HOST
                value: dagster-postgres-rw.catalyst-data.svc.cluster.local
              - name: DAGSTER_POSTGRES_PORT
                value: "5432"
              - name: DAGSTER_POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: dagster-postgres-app
                    key: username
              - name: DAGSTER_POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: dagster-postgres-app
                    key: password
              - name: DAGSTER_POSTGRES_DB
                value: dagster
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: dagster-s3-credentials
                    key: DAGSTER_S3_ACCESS_KEY
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: dagster-s3-credentials
                    key: DAGSTER_S3_SECRET_KEY
              - name: CONGRESS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: congress-data-secrets
                    key: CONGRESS_API_KEY
              - name: LLM_MODEL
                value: "runpod/gemma-4-31b-it"
              - name: LLM_BASE_URL
                value: http://litellm.catalyst-llm.svc.cluster.local:4000/v1
              - name: EMBEDDING_MODEL
                value: "ollama-mac/nomic-embed-text"
              - name: EMBEDDING_BASE_URL
                value: http://litellm.catalyst-llm.svc.cluster.local:4000/v1
              - name: EMBEDDING_DIMENSIONS
                value: "768"
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: llm-credentials
                    key: LLM_API_KEY
            envFrom:
              - secretRef:
                  name: dagster-s3-credentials
              - secretRef:
                  name: llm-credentials
              - secretRef:
                  name: congress-data-secrets
            volume_mounts:
              - name: metube-downloads
                mountPath: /data/metube
                readOnly: true
              - name: tubesync-downloads
                mountPath: /data/tubesync
                readOnly: true
              - name: whisper-models
                mountPath: /data/whisper-models
          pod_spec_config:
            service_account_name: dagster
            image_pull_secrets:
              - name: ghcr-secret
            volumes:
              - name: metube-downloads
                persistentVolumeClaim:
                  claimName: metube-downloads
              - name: tubesync-downloads
                persistentVolumeClaim:
                  claimName: tubesync-downloads
              - name: whisper-models
                persistentVolumeClaim:
                  claimName: whisper-models
          job_spec_config:
            ttl_seconds_after_finished: 3600

    compute_logs:
      module: dagster_aws.s3.compute_log_manager
      class: S3ComputeLogManager
      config:
        bucket: catalyst-data
        prefix: compute-logs
        local_dir: /tmp/dagster-compute-logs
        upload_interval: 30
        skip_empty_files: true
        endpoint_url:
          env: DAGSTER_S3_ENDPOINT_URL

    # Capture our Python loggers into Dagster's structured event log.
    # These show up in the Events tab with proper run/step metadata,
    # alongside Dagster's own events. No custom StreamHandlers needed.
    python_logs:
      managed_python_loggers:
        - dagster_io
        - catalyst_exgraph
        - catalyst_llm_contract_mcp
        - media_ingest
        - congress_data
        - open_leaks
        - knowledge_graph
      python_log_level: INFO

    telemetry:
      enabled: false
