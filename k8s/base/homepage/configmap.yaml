---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalyst-data-homepage-config
data:
  kubernetes.yaml: |
    mode: cluster
    traefik: true

  settings.yaml: |
    # instanceName scopes which services this homepage discovers.
    # Only IngressRoutes annotated with gethomepage.dev/instance: "data"
    # will appear. Must be in settings.yaml, NOT kubernetes.yaml.
    instanceName: data
    title: Catalyst Data Platform
    background:
      image: https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1920
      blur: sm
      opacity: 20
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Data Pipelines:
        style: row
        columns: 3
      Data Services:
        style: row
        columns: 3
      Databases:
        style: row
        columns: 3
      Code Locations:
        style: row
        columns: 4

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "Catalyst Data"
        nodes:
          show: false
    - search:
        provider: duckduckgo
        target: _blank
    - greeting:
        text_size: 2xl
        text: "Catalyst Data Platform"
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short

  services.yaml: |
    # Code locations are gRPC servers (not HTTP) — no siteMonitor
    - Code Locations:
        - Congress Data:
            icon: si-python
            description: Congressional data pipeline
        - Knowledge Graph:
            icon: si-python
            description: Knowledge graph builder
        - Media Ingest:
            icon: si-python
            description: Media metadata ingest
        - Open Leaks:
            icon: si-python
            description: Leaked document ingestion

    # Postgres uses TCP not HTTP — no siteMonitor. Neo4j is now
    # discovered via IngressRoute annotation (Neo4j Browser).
    - Databases:
        - Dagster Postgres:
            icon: si-postgresql
            description: Pipeline Metadata DB
        - Knowledge Postgres:
            icon: si-postgresql
            description: Knowledge Graph DB

  bookmarks.yaml: |
    - Data Links:
        - Dagster Docs:
            - icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/dagster.png
              href: https://docs.dagster.io/
              description: Pipeline Framework
        - Neo4j Docs:
            - icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/neo4j.png
              href: https://neo4j.com/docs/
              description: Graph Database

  docker.yaml: |
    ---
