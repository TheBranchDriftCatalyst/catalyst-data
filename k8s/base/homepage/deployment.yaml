---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-data-homepage
  labels:
    app: catalyst-data-homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalyst-data-homepage
  template:
    metadata:
      labels:
        app: catalyst-data-homepage
    spec:
      serviceAccountName: catalyst-data-homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            # ConfigMap files mounted individually via subPath so the
            # dir stays writable (Homepage needs to create /app/config/logs/)
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: catalyst-data-homepage-config
