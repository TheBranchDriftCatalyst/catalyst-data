---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: congress-data
  labels:
    app: congress-data
    app.kubernetes.io/name: congress-data
    app.kubernetes.io/part-of: catalyst-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: congress-data
  template:
    metadata:
      labels:
        app: congress-data
        app.kubernetes.io/name: congress-data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: code-server
          image: ghcr.io/thebranchdriftcatalyst/congress-data:latest
          ports:
            - name: grpc
              containerPort: 4000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: DAGSTER_CONTAINER_CONTEXT
              value: '{"k8s": {"env_vars": ["DAGSTER_CODE_LOCATION=congress_data", "PROMPT_REGISTRY_DIR=/app/prompts"], "env_secrets": ["congress-data-secrets", "llm-credentials", "dagster-s3-credentials"]}}'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "catalyst-data.congress-data"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=catalyst-data,deployment.environment=production"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: LOG_FORMAT
              value: "json"
            - name: METRICS_PORT
              value: "9090"
            - name: PROMETHEUS_PUSHGATEWAY_URL
              value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
            - name: CONGRESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: congress-data-secrets
                  key: CONGRESS_API_KEY
            # CloudNativePG read-write endpoint (TALOS-zjh0). Credentials come from
            # the CNPG-generated dagster-postgres-app secret, not a literal.
            - name: DAGSTER_POSTGRES_HOST
              value: "dagster-postgres-rw.catalyst-data.svc.cluster.local"
            - name: DAGSTER_POSTGRES_PORT
              value: "5432"
            - name: DAGSTER_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-app
                  key: username
            - name: DAGSTER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-postgres-app
                  key: password
            - name: DAGSTER_POSTGRES_DB
              value: "dagster"
            - name: DAGSTER_CODE_LOCATION
              value: congress_data
            - name: DAGSTER_CURRENT_IMAGE
              value: ghcr.io/thebranchdriftcatalyst/congress-data:latest
            - name: DAGSTER_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_ENDPOINT_URL
            - name: DAGSTER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_ACCESS_KEY
            - name: DAGSTER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_SECRET_KEY
            - name: DAGSTER_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_BUCKET
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: LLM_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: LLM_API_KEY
            - name: LLM_BASE_URL
              value: http://litellm.catalyst-llm.svc.cluster.local:4000/v1
            - name: LLM_MODEL
              value: "runpod/gemma-4-31b-it"
            - name: EMBEDDING_BASE_URL
              value: http://litellm.catalyst-llm.svc.cluster.local:4000/v1
            - name: EMBEDDING_MODEL
              value: "ollama-mac/nomic-embed-text"
            - name: EMBEDDING_DIMENSIONS
              value: "768"
            - name: PROMPT_REGISTRY_DIR
              value: /app/prompts
          volumeMounts:
            - name: prompts
              mountPath: /app/prompts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: prompts
          configMap:
            name: congress-data-prompts
