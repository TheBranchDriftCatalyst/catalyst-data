# ─────────────────────────────────────────────────────────────────────────────
# Congress-Data Domain Label Pack
#
# One file, four "prompts" — one per voter in the NER ensemble. Each voter
# has a different prompting idiom; this pack expresses the same canonical
# entity taxonomy in each model's native shape.
#
# Loaded by catalyst-exgraph at pipeline build time via
#   StageConfig(prompt_dir=..., label_pack_id="congress")
# which resolves to <prompt_dir>/congress.labels.yaml.
#
# Each section's `model` field overrides the encoder client default; everything
# else feeds the client's domain-tailoring hooks.
# ─────────────────────────────────────────────────────────────────────────────
version: 1
domain: congress-data
description: >
  U.S. legislative-process entity taxonomy tuned for bill text, committee
  reports, the Congressional Record, and Congress.gov action logs.

# Canonical type universe — the consensus voter aligns each encoder's native
# label namespace back to these IDs via the `canonical_type` field on each
# section below. Keep this list short; aliases live on the encoder sections.
canonical_types:
  - PERSON             # legislators, officials, witnesses
  - ORG                # committees, agencies, departments
  - GPE                # states, districts, countries
  - LOC                # geographic features
  - DATE               # specific dates, sessions
  - MONEY              # appropriations, dollar amounts
  - NORP               # parties, caucuses
  - FACILITY           # Capitol, military bases
  - BILL               # bill citations (H.R., S., S.J.Res. …)
  - PUBLIC_LAW         # P.L. 119-1
  - LAW_CITATION       # U.S.C. / Stat. citations
  - COMMITTEE_REF      # named committee/subcommittee (subtype of ORG, kept separate for routing)
  - AMENDMENT          # S.Amdt.34, H.Amdt.112
  - SECTION_REF        # § 1001(a)(2)
  - ROLL_CALL_VOTE     # roll-call numbers
  - VOTE_RESULT        # Passed / Failed / yeas-nays tallies
  - ACTION             # legislative action verbs as named events
  - POLICY_AREA        # CRS controlled vocab
  - SPONSOR_ROLE       # sponsor / cosponsor / chair / ranking member
  - DOCUMENT           # CRS reports, GAO reports
  - ROLE               # Speaker, Whip, Secretary, …

# ─────────────────────────────────────────────────────────────────────────────
# 1. GLiNER — descriptive natural-language labels
#
# Bi-encoder family handles 20+ labels without degradation. Each label is a
# noun phrase rich enough to disambiguate from neighbors. Threshold dropped
# from the 0.5 default → 0.3 because descriptive labels score lower in
# absolute terms; the ensemble vote handles precision downstream.
# ─────────────────────────────────────────────────────────────────────────────
gliner:
  model: knowledgator/gliner-bi-large-v1.0
  threshold: 0.3
  flat_ner: false        # allow nested spans (e.g. "Subtitle B of H.R. 1234")
  window_tokens: 320
  window_overlap_tokens: 32

  # label_text → canonical_type
  labels:
    "member of the U.S. Congress, a senator or representative": PERSON
    "U.S. senator":                                              PERSON
    "U.S. representative":                                       PERSON
    "executive branch official such as a cabinet secretary":     PERSON
    "witness testifying before a congressional committee":       PERSON

    "U.S. congressional committee or subcommittee":              COMMITTEE_REF
    "federal agency, department, or independent commission":     ORG
    "political party, caucus, or coalition":                     NORP

    "bill number such as H.R. 1234 or S. 567 or S.J.Res. 12":    BILL
    "public law citation such as P.L. 119-1":                    PUBLIC_LAW
    "United States Code citation such as 5 U.S.C. section 552":  LAW_CITATION
    "Statutes at Large citation such as 136 Stat. 1818":         LAW_CITATION
    "amendment number such as S.Amdt. 34 or H.Amdt. 112":        AMENDMENT
    "named act of legislation such as the Clean Air Act":        BILL
    "section or subsection reference such as section 1001(a)(2)": SECTION_REF

    "U.S. state, territory, or D.C., by name or postal code":    GPE
    "congressional district":                                    GPE
    "U.S. city or locality":                                     GPE
    "geographic region or feature":                              LOC

    "chamber of Congress (House of Representatives or Senate)":  ORG
    "legislative role such as sponsor, cosponsor, chair, ranking member": SPONSOR_ROLE
    "leadership role such as Speaker, Majority Leader, Whip":    ROLE

    "roll call vote number or identifier":                       ROLL_CALL_VOTE
    "vote outcome such as Passed, Failed, Agreed to":            VOTE_RESULT
    "yeas-nays tally such as 218-212":                           VOTE_RESULT

    "legislative action such as referred, reported, passed, signed, vetoed": ACTION
    "policy area such as Energy, Health, Agriculture":           POLICY_AREA

    "date of a legislative action":                              DATE
    "congressional session identifier such as 119th Congress, 1st Session": DATE

    "monetary amount or appropriation":                          MONEY
    "government building such as the Capitol or White House":    FACILITY
    "official report such as a CRS report or GAO report":        DOCUMENT

# ─────────────────────────────────────────────────────────────────────────────
# 2. NuExtract — typed JSON template (v2.0 `### Template:` protocol)
#
# Descriptive keys ARE the prompt: each key becomes a semantic anchor. Mix of
# verbatim-string (copy from input, for identifiers), string (paraphrasable),
# date-time, integer, and enums (closed sets). Nested objects + arrays of
# objects let us emit STRUCTURED RELATIONS in one shot — sponsor→state→party
# arrives pre-linked.
#
# Sized just under the ~10-top-level-keys rule of thumb. If a bill's text
# crosses that boundary, split by phase (introduction / committee / floor /
# vote / enrollment) using `template_variants` below.
# ─────────────────────────────────────────────────────────────────────────────
nuextract:
  model: numind/NuExtract-2.0-4B   # 8B preferred if available
  temperature: 0.0
  # Where each NuExtract key maps back into the canonical type universe so the
  # consensus voter can align it with GLiNER/UniNER spans.
  canonical_type_map:
    "Bill.BillNumber":               BILL
    "Bill.ShortTitle":                BILL
    "Bill.Sponsor.Name":              PERSON
    "Bill.Sponsor.State":             GPE
    "Bill.Sponsor.Party":             NORP
    "Bill.Cosponsors[].Name":         PERSON
    "Bill.Cosponsors[].State":        GPE
    "Bill.Cosponsors[].Party":        NORP
    "Bill.ReferredToCommittees[]":    COMMITTEE_REF
    "Actions[].ActionText":           ACTION
    "Actions[].Date":                 DATE
    "Actions[].Chamber":              ORG
    "Amendments[].AmendmentNumber":   AMENDMENT
    "Amendments[].SponsorName":       PERSON
    "RollCallVotes[].RollCallNumber": ROLL_CALL_VOTE
    "RollCallVotes[].Result":         VOTE_RESULT
    "RollCallVotes[].YeaCount":       VOTE_RESULT
    "RollCallVotes[].NayCount":       VOTE_RESULT
    "PublicLaw.Citation":             PUBLIC_LAW
    "PublicLaw.SignedDate":           DATE
    "SectionReferences[]":            SECTION_REF
    "PolicyArea":                     POLICY_AREA

  template:
    Bill:
      BillNumber:     verbatim-string
      ShortTitle:     verbatim-string
      OfficialTitle:  string
      Chamber:        ["House", "Senate"]
      IntroducedDate: date-time
      Sponsor:
        Name:  verbatim-string
        State: verbatim-string
        Party: ["D", "R", "I"]
      Cosponsors:
        - Name:  verbatim-string
          State: verbatim-string
          Party: ["D", "R", "I"]
      ReferredToCommittees:
        - verbatim-string
    Actions:
      - Date:    date-time
        Chamber: ["House", "Senate", "Joint"]
        ActionText: verbatim-string
        ActionType: ["Introduction", "Referral", "Markup", "Reported", "Floor Consideration",
                     "Floor Vote", "Conference", "Presented to President", "Signed", "Vetoed",
                     "Override Vote", "Pocket Vetoed"]
    Amendments:
      - AmendmentNumber: verbatim-string
        SponsorName:     verbatim-string
        Purpose:         string
        Disposition:     ["Agreed to", "Rejected", "Withdrawn", "Pending"]
    RollCallVotes:
      - RollCallNumber: verbatim-string
        Question:       verbatim-string
        Result:         ["Passed", "Failed", "Agreed to", "Rejected", "Sustained", "Overridden"]
        YeaCount:       integer
        NayCount:       integer
        ChamberOfVote:  ["House", "Senate"]
    PublicLaw:
      Citation:   verbatim-string
      SignedDate: date-time
    SectionReferences:
      - verbatim-string
    PolicyArea: verbatim-string

  # When a chunk is dense enough to blow the ~10-key rule, swap to one of these
  # phase-specific templates. Pipeline picks based on the chunk's `action_type`
  # metadata from the section-aware chunker (see congress-data/CHUNKING.md).
  template_variants:
    floor_action:
      RollCallVotes:
        - RollCallNumber: verbatim-string
          Question:       verbatim-string
          Result:         ["Passed", "Failed", "Agreed to", "Rejected"]
          YeaCount:       integer
          NayCount:       integer
          PartyBreakdown:
            DemocratYea:  integer
            DemocratNay:  integer
            RepublicanYea: integer
            RepublicanNay: integer
      MotionsConsidered:
        - MotionText: verbatim-string
          MovedBy:    verbatim-string
          Disposition: ["Agreed to", "Rejected", "Tabled", "Withdrawn"]
    committee_phase:
      CommitteeActions:
        - CommitteeName: verbatim-string
          ActionDate:    date-time
          ActionType:    ["Referral", "Hearing", "Markup", "Reported Favorably",
                          "Reported Unfavorably", "Reported Without Recommendation",
                          "Discharged"]
          ReportNumber:  verbatim-string
      Witnesses:
        - Name:         verbatim-string
          Affiliation:  verbatim-string
          Role:         ["Government", "Industry", "Academic", "Advocacy", "Private Citizen"]

# ─────────────────────────────────────────────────────────────────────────────
# 3. UniversalNER — conversational one-type-per-turn queries
#
# Each canonical type maps to one or more probe queries; the merger unions
# the results. Multi-probe is for types where the legislative subtype
# ("senator", "representative") recalls better than the generic ("person")
# on chamber-specific text. Keep the assistant prime exactly "I've read this
# text." — it's part of UniNER's training distribution; paraphrasing it
# degrades recall.
#
# Forward-pass cost = sum of unique queries across all types. Aim for ~15.
# ─────────────────────────────────────────────────────────────────────────────
universalner:
  model: Universal-NER/UniNER-7B-all
  temperature: 0.0
  assistant_prime: "I've read this text."     # leave verbatim — see note above
  max_chars_per_call: 6000                    # truncate; 7B model + ~10 turns

  # canonical_type → list of probe queries (unioned)
  queries:
    PERSON:
      - "senator"
      - "representative"
      - "member of Congress"
      - "cabinet secretary or executive branch official"
    COMMITTEE_REF:
      - "congressional committee"
      - "congressional subcommittee"
    ORG:
      - "federal agency"
      - "government department"
    BILL:
      - "bill"
      - "piece of legislation"
      - "act of Congress"
    PUBLIC_LAW:
      - "public law"
    LAW_CITATION:
      - "United States Code citation"
      - "Statutes at Large citation"
    AMENDMENT:
      - "amendment to a bill"
    SECTION_REF:
      - "section reference"
    ROLL_CALL_VOTE:
      - "roll call vote"
    VOTE_RESULT:
      - "vote result"
    SPONSOR_ROLE:
      - "sponsor of a bill"
      - "cosponsor of a bill"
    GPE:
      - "U.S. state"
      - "congressional district"
    NORP:
      - "political party"
      - "political caucus"
    DATE:
      - "date"
      - "congressional session"
    MONEY:
      - "monetary amount"
      - "appropriation"
    POLICY_AREA:
      - "policy area"
    FACILITY:
      - "government building"
    DOCUMENT:
      - "official report"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Regex — deterministic 4th voter, 100% precision on format-validated IDs
#
# Runs before the model-based encoders. Its votes carry confidence=1.0 and
# break ties on format-validated identifiers (bill numbers, P.L. cites, etc.).
# Patterns are intentionally tight — if it matches, it's correct.
# ─────────────────────────────────────────────────────────────────────────────
regex:
  patterns:
    BILL:
      - '\b(?:H\.R\.|S\.|H\.J\.Res\.|S\.J\.Res\.|H\.Con\.Res\.|S\.Con\.Res\.|H\.Res\.|S\.Res\.)\s?\d{1,5}\b'
    PUBLIC_LAW:
      - '\bP(?:ub)?\.?\s?L(?:aw)?\.?\s?\d{2,3}-\d{1,4}\b'
      - '\bPublic\s+Law\s+\d{2,3}-\d{1,4}\b'
    LAW_CITATION:
      - '\b\d{1,2}\s+U\.S\.C\.\s*§+\s*\d+(?:\([a-z]\))?(?:\(\d+\))?\b'
      - '\b\d+\s+Stat\.\s+\d+\b'
    AMENDMENT:
      - '\b(?:H|S)\.Amdt\.\s?\d{1,5}\b'
      - '\bAmendment\s+No\.\s+\d{1,5}\b'
    SECTION_REF:
      - '§§?\s?\d+(?:\([a-z]\))?(?:\(\d+\))?'
      - '\bSec(?:tion)?\.?\s+\d+(?:\([a-z]\))?\b'
      - '\bTitle\s+[IVX]+\b'
      - '\bSubtitle\s+[A-Z]\b'
    ROLL_CALL_VOTE:
      - '\bRoll(?:\s*Call)?\s*(?:No\.|Number)?\s*\d{1,4}\b'
    NORP:
      - '\b\((?:D|R|I)-[A-Z]{2}(?:-\d{1,2})?\)'   # party-state suffix: (D-NY-12)
    GPE:
      - '\b(?:AL|AK|AZ|AR|CA|CO|CT|DE|DC|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY)\b'
    DATE:
      - '\b\d{1,3}(?:st|nd|rd|th)\s+Congress(?:,\s+\d(?:st|nd|rd|th)\s+Session)?\b'

  # Hint to consensus_predicate: regex votes always win ties for these types.
  authoritative_for:
    - BILL
    - PUBLIC_LAW
    - LAW_CITATION
    - AMENDMENT
    - ROLL_CALL_VOTE

# ─────────────────────────────────────────────────────────────────────────────
# 5. AMR frames — PropBank frame → canonical predicate
#
# AMR parsers emit predicate nodes labelled with PropBank frames
# (introduce-01, refer-01, vote-01, …). The AMR-to-assertion projection
# node walks each frame and looks up the canonical predicate from this
# table. Predicate vocabulary aligns with the canonical predicates in
# proposition_extraction.prompt (sponsors / refers_to / passed / vetoed_by
# etc.) plus a few legislative-process refinements that AMR exposes
# cleanly but plain LLM extraction tends to collapse.
#
# unknown_frame_action = "novel" — emit NOVEL_{frame} so unmapped frames
# surface in review rather than silently dropping or polluting the
# canonical vocab.
# ─────────────────────────────────────────────────────────────────────────────
amr_frames:
  unknown_frame_action: novel        # flag unknown frames for human review
  # Canonical predicate values below are aligned with the SPO prompt's
  # controlled vocabulary in proposition_extraction.prompt wherever a
  # 1:1 equivalent exists. Predicates that legitimately extend the
  # prompt vocab (committee-procedure verbs AMR exposes cleanly that
  # the LLM SPO path tends to collapse) are listed under
  # `extended_predicates` so the cross-validation QA test treats them
  # as deliberate extensions, not contract violations.
  frames:
    # ── Sponsorship ──────────────────────────────────────────────
    introduce-01:        introduces            # "Smith introduced H.R. 1234"
    sponsor-01:          sponsors              # "Smith is the sponsor of …"
    co-sponsor-01:       co_sponsors
    cosponsor-01:        co_sponsors
    # withdraw-01 in legislative context is cosponsorship withdrawal —
    # AMR encodes this as co-sponsor with :polarity -, so we map to
    # co_sponsors and let the projection node read :polarity off the
    # graph to set negated=True. Avoids inventing a separate predicate
    # that the SPO validator would reject.
    withdraw-01:         co_sponsors

    # ── Legislative process ─────────────────────────────────────
    refer-01:            refers_to
    report-01:           reported_by           # EXTENSION
    discharge-01:        discharged_from       # EXTENSION
    consider-02:         considered_by         # EXTENSION
    place-01:            placed_on_calendar    # EXTENSION

    # ── Floor action ────────────────────────────────────────────
    pass-03:             passed                # "the bill passed the House"
    pass-09:             passed                # alternative frame for passage
    fail-01:             failed
    agree-01:            agreed_to             # EXTENSION (procedural agreement, not policy support)
    reject-01:           rejected              # EXTENSION
    # vote-01 is polarity-blind at the frame level; the AMR :polarity
    # edge on the vote node determines votes_for vs votes_against. The
    # projection node MUST read polarity before emitting — `voted_on`
    # is the neutral fallback when polarity is absent.
    vote-01:             voted_on              # EXTENSION (polarity-aware mapping done downstream)
    move-01:             motion_to_recommit    # EXTENSION (context-dependent)

    # ── Amendment ───────────────────────────────────────────────
    amend-01:            amends
    propose-01:          amends                # when subject is a Member proposing an amendment
    strike-01:           struck_amendment      # EXTENSION

    # ── Enactment ───────────────────────────────────────────────
    present-01:          presented_to_president  # EXTENSION
    sign-01:             signed_by
    # "becomes law" — semantically equivalent to enactment (10-day rule
    # or signing). Folded into `enacted` to keep the predicate vocab
    # compact; the AMR graph still distinguishes the two frames.
    become-01:           enacted
    enact-01:            enacted
    veto-01:             vetoed_by
    override-01:         override_succeeded    # EXTENSION

    # ── Jurisdiction / committee membership ─────────────────────
    chair-01:            chairs
    rank-01:             ranks_on              # EXTENSION (ranking member, distinct from chair)
    sit-02:              member_of
    have-org-role-91:    member_of             # ARG2 role-value handled via role_overrides

    # ── Citation / cross-reference ──────────────────────────────
    cite-01:             cites                 # EXTENSION
    repeal-01:           repeals               # EXTENSION
    supersede-01:        supersedes            # EXTENSION
    codify-01:           codified_at           # EXTENSION

  # Canonical predicates emitted by this pack that intentionally extend
  # the SPO prompt's controlled vocabulary. The cross-validation QA
  # test asserts `set(frames.values()) ⊆ prompt_predicates ∪ extended_predicates`.
  # Anything emitted but missing from BOTH lists is a contract bug.
  extended_predicates:
    - agreed_to
    - cites
    - codified_at
    - considered_by
    - discharged_from
    - motion_to_recommit
    - override_succeeded
    - placed_on_calendar
    - presented_to_president
    - ranks_on
    - rejected
    - repeals
    - reported_by
    - struck_amendment
    - supersedes
    - voted_on

  role_overrides:
    # have-org-role-91 has its own argument structure: ARG0 = person,
    # ARG1 = organization, ARG2 = role. Tell the projection node to
    # interpret these differently from the default ARG0=subject/ARG1=object.
    have-org-role-91:
      ARG0: subject       # the person
      ARG1: object        # the org
      ARG2: role_value    # the role title — becomes a qualifier, not a separate triple

    # withdraw-01 (cosponsorship withdrawal): ARG0 = Member, ARG1 = bill,
    # ARG2 = (optional) reason. The projection node should also read
    # :polarity off the AMR node and set negated=True on the assertion.
    withdraw-01:
      ARG0: subject
      ARG1: object

    # Passive-voice legislative procedure frames. Standard PropBank
    # rolesets put the patient on ARG1 and the destination on ARG2; the
    # agent (ARG0) is usually unstated in passive voice (e.g., "the bill
    # was referred to the Committee"). For the canonical SPO projection
    # we want bill→refers_to→committee, not (empty)→refers_to→bill, so
    # remap ARG1→subject and ARG2→object.
    #
    # Surfaced by the AMR MVP demo (examples/amr_congress_mvp.py): with
    # the default ARG0=subject/ARG1=object mapping, refer-01 produced
    # assertions with empty subject_text because the AMR node had no
    # ARG0. Same shape applies to report-01 (committee → bill) and
    # discharge-01 (committee → bill).
    refer-01:
      ARG1: subject       # the bill being referred
      ARG2: object        # the destination committee
    report-01:
      ARG0: subject       # the reporting committee
      ARG1: object        # the bill being reported
    discharge-01:
      ARG0: subject       # the discharging committee
      ARG1: object        # the bill being discharged

# ─────────────────────────────────────────────────────────────────────────────
# 6. Consensus tuning — how the 4 voters reconcile
# ─────────────────────────────────────────────────────────────────────────────
consensus:
  span_iou_threshold: 0.5          # spans agree if IoU ≥ 0.5
  type_agreement:
    # Canonical types that may be voted as equivalent (UniNER's "person" and
    # GLiNER's "U.S. senator" both → PERSON). The labels sections above already
    # encode this mapping; this is the override list for special cases.
    PERSON:
      aliases: [SENATOR, REPRESENTATIVE]
    ORG:
      aliases: [COMMITTEE_REF, FEDERAL_AGENCY, CHAMBER]
    BILL:
      aliases: [LEGISLATION, ACT]
  # Confidence weighting: scored encoders contribute their score; binary
  # encoders (NuExtract, regex) contribute 1.0 per emission.
  scored_voters: [gliner, universalner]
  binary_voters: [nuextract, regex]
