---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-knowledge-init
  labels:
    app: postgres-knowledge
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    CREATE TABLE IF NOT EXISTS canonical_entities (
        canonical_id TEXT PRIMARY KEY,
        canonical_name TEXT NOT NULL,
        entity_type TEXT NOT NULL,
        aliases TEXT[] DEFAULT '{}',
        external_ids JSONB DEFAULT '{}',
        embedding vector(1536),
        mention_count INTEGER DEFAULT 0,
        source_code_locations TEXT[] NOT NULL DEFAULT '{}',
        first_seen TIMESTAMPTZ DEFAULT NOW(),
        last_seen TIMESTAMPTZ DEFAULT NOW(),
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Idempotent migration for existing deployments whose init.sql ran
    -- before source_code_locations existed. Runtime ALTER in
    -- GraphDBResource._ensure_canonical_entities_schema also covers this
    -- path but re-running it here keeps the ConfigMap self-describing.
    ALTER TABLE canonical_entities
        ADD COLUMN IF NOT EXISTS source_code_locations TEXT[] NOT NULL DEFAULT '{}';
    ALTER TABLE canonical_entities
        ADD COLUMN IF NOT EXISTS source_candidate_ids TEXT[] DEFAULT '{}';

    -- Alignment edge denormalized metadata (human-readable names + provenance)
    ALTER TABLE alignment_edges ADD COLUMN IF NOT EXISTS source_name TEXT DEFAULT '';
    ALTER TABLE alignment_edges ADD COLUMN IF NOT EXISTS target_name TEXT DEFAULT '';
    ALTER TABLE alignment_edges ADD COLUMN IF NOT EXISTS entity_type TEXT DEFAULT '';
    ALTER TABLE alignment_edges ADD COLUMN IF NOT EXISTS source_code_location TEXT DEFAULT '';
    ALTER TABLE alignment_edges ADD COLUMN IF NOT EXISTS target_code_location TEXT DEFAULT '';

    CREATE TABLE IF NOT EXISTS alignment_edges (
        edge_id TEXT PRIMARY KEY,
        source_entity_id TEXT NOT NULL,
        target_entity_id TEXT NOT NULL,
        alignment_type TEXT NOT NULL,
        score REAL NOT NULL,
        evidence JSONB DEFAULT '[]',
        method TEXT DEFAULT '',
        source_name TEXT DEFAULT '',
        target_name TEXT DEFAULT '',
        entity_type TEXT DEFAULT '',
        source_code_location TEXT DEFAULT '',
        target_code_location TEXT DEFAULT '',
        created_at TIMESTAMPTZ DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS assertions (
        assertion_id TEXT PRIMARY KEY,
        subject_canonical_id TEXT REFERENCES canonical_entities(canonical_id),
        predicate TEXT NOT NULL,
        predicate_canonical TEXT DEFAULT '',
        object_canonical_id TEXT REFERENCES canonical_entities(canonical_id),
        qualifiers JSONB DEFAULT '{}',
        confidence REAL DEFAULT 1.0,
        negated BOOLEAN DEFAULT FALSE,
        hedged BOOLEAN DEFAULT FALSE,
        source_document_id TEXT,
        chunk_id TEXT,
        code_location TEXT DEFAULT '',
        created_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Indexes
    CREATE INDEX IF NOT EXISTS idx_entities_name ON canonical_entities USING gin (canonical_name gin_trgm_ops);
    CREATE INDEX IF NOT EXISTS idx_entities_type ON canonical_entities (entity_type);
    CREATE INDEX IF NOT EXISTS idx_entities_embedding ON canonical_entities USING ivfflat (embedding vector_cosine_ops) WITH (lists = 100);
    CREATE INDEX IF NOT EXISTS idx_entities_source_code_locations ON canonical_entities USING gin (source_code_locations);

    CREATE INDEX IF NOT EXISTS idx_align_source ON alignment_edges (source_entity_id);
    CREATE INDEX IF NOT EXISTS idx_align_target ON alignment_edges (target_entity_id);
    CREATE INDEX IF NOT EXISTS idx_align_type ON alignment_edges (alignment_type);

    CREATE INDEX IF NOT EXISTS idx_assert_subject ON assertions (subject_canonical_id);
    CREATE INDEX IF NOT EXISTS idx_assert_object ON assertions (object_canonical_id);
    CREATE INDEX IF NOT EXISTS idx_assert_predicate ON assertions (predicate_canonical);
    CREATE INDEX IF NOT EXISTS idx_assert_code_location ON assertions (code_location);

    -- Speaker identity tables (CD-34j.1)
    -- HITL entity alias overrides (CD-3sz)
    CREATE TABLE IF NOT EXISTS viewer_entity_overrides (
        override_id TEXT PRIMARY KEY,
        alias_text TEXT NOT NULL,
        target_name TEXT NOT NULL,
        entity_type TEXT NOT NULL,
        reviewer TEXT DEFAULT '',
        notes TEXT DEFAULT '',
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_veo_active ON viewer_entity_overrides(is_active);
    CREATE INDEX IF NOT EXISTS idx_veo_alias ON viewer_entity_overrides(alias_text);

    -- Speaker identity tables (CD-34j.1)
    CREATE TABLE IF NOT EXISTS speaker_profiles (
        profile_id       TEXT PRIMARY KEY,
        centroid         vector(192) NOT NULL,
        display_name     TEXT,
        member_count     INT NOT NULL DEFAULT 0,
        total_duration_s REAL NOT NULL DEFAULT 0,
        first_seen       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        last_seen        TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_speaker_profiles_centroid ON speaker_profiles USING ivfflat (centroid vector_cosine_ops);

    CREATE TABLE IF NOT EXISTS speaker_profile_members (
        profile_id    TEXT REFERENCES speaker_profiles(profile_id),
        document_id   TEXT NOT NULL,
        local_label   TEXT NOT NULL,
        segment_count INT NOT NULL DEFAULT 0,
        PRIMARY KEY (profile_id, document_id, local_label)
    );
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-knowledge
  labels:
    app: postgres-knowledge
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-knowledge
  labels:
    app: postgres-knowledge
    app.kubernetes.io/name: postgres-knowledge
    app.kubernetes.io/part-of: catalyst-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-knowledge
  template:
    metadata:
      labels:
        app: postgres-knowledge
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: knowledge_graph
            - name: POSTGRES_USER
              value: kg
            - name: POSTGRES_PASSWORD
              value: kg-homelab
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-knowledge
        - name: init
          configMap:
            name: postgres-knowledge-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-knowledge
  labels:
    app: postgres-knowledge
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgres-knowledge
