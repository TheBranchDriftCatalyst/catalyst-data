---
# Dagster — HTTPS + Authentik forward-auth SSO on dagster.talos00 (TALOS-xgrl.18).
# FULLY gated (incl. /graphql). /graphql is Dagster's ENTIRE control-plane API
# (launch/terminate runs, wipe assets, GraphiQL) with NO native auth, so a no-mw
# exclusion would be unauthenticated full control on the LAN. The browser UI works
# via the SSO cookie; external CLI/CI must use the in-cluster dagster-webserver svc
# (or add a token/IP-allowlist mw on /graphql if external API access is needed).
# SSO via the forward_single provider in talos-homelab sister-apps-blueprint.yaml.
# TLS: default TLSStore serves *.talos00 via SNI. web→https redirect below.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dagster
  labels:
    app: dagster
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: "data"
    gethomepage.dev/name: "Dagster"
    gethomepage.dev/description: "Data Pipeline Orchestrator"
    gethomepage.dev/group: "Data Pipelines"
    gethomepage.dev/icon: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/dagster-dark.png"
    gethomepage.dev/href: "https://dagster.talos00"
    gethomepage.dev/siteMonitor: "http://dagster-webserver.catalyst-data.svc.cluster.local:3000"
    gethomepage.dev/pod-selector: "app.kubernetes.io/component=webserver"
    gethomepage.dev/weight: "1"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dagster.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: dagster-webserver
          port: 3000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dagster-http
  labels:
    app: dagster
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dagster.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: dagster-webserver
          port: 3000
