---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-ingest
  labels:
    app: media-ingest
    app.kubernetes.io/name: media-ingest
    app.kubernetes.io/part-of: catalyst-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-ingest
  template:
    metadata:
      labels:
        app: media-ingest
        app.kubernetes.io/name: media-ingest
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: code-server
          image: ghcr.io/thebranchdriftcatalyst/media-ingest:latest
          ports:
            - name: grpc
              containerPort: 4000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: viewer
              containerPort: 8080
              protocol: TCP
          env:
            # Signal to media_ingest __init__ that this is the code-server pod
            # (enables the viewer daemon thread; run/step pods skip it)
            - name: DAGSTER_IS_CODE_SERVER
              value: "1"
            # Dagster instance postgres (needed for sensor context.instance access)
            - name: DAGSTER_POSTGRES_HOST
              value: dagster-postgres.catalyst-data.svc.cluster.local
            - name: DAGSTER_POSTGRES_PORT
              value: "5432"
            - name: DAGSTER_POSTGRES_USER
              value: dagster
            - name: DAGSTER_POSTGRES_PASSWORD
              value: dagster-homelab
            - name: DAGSTER_POSTGRES_DB
              value: dagster
            # Knowledge graph postgres (for annotation store)
            - name: KG_PG_HOST
              value: postgres-knowledge.catalyst-data.svc.cluster.local
            - name: KG_PG_PORT
              value: "5432"
            - name: KG_PG_DB
              value: knowledge_graph
            - name: KG_PG_USER
              value: kg
            - name: KG_PG_PASSWORD
              value: kg-homelab
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "catalyst-data.media-ingest"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=catalyst-data,deployment.environment=production"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: LOG_FORMAT
              value: "json"
            - name: METRICS_PORT
              value: "9090"
            - name: PROMETHEUS_PUSHGATEWAY_URL
              value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
            - name: DAGSTER_CODE_LOCATION
              value: media_ingest
            - name: SPEAKER_PROFILE_ENABLED
              value: "true"
            - name: DAGSTER_CURRENT_IMAGE
              value: ghcr.io/thebranchdriftcatalyst/media-ingest:latest
            - name: DAGSTER_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_ENDPOINT_URL
            - name: DAGSTER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_ACCESS_KEY
            - name: DAGSTER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_SECRET_KEY
            - name: DAGSTER_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: dagster-s3-credentials
                  key: DAGSTER_S3_BUCKET
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: LLM_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: LLM_API_KEY
            - name: LLM_BASE_URL
              value: http://litellm.catalyst-llm.svc.cluster.local:4000/v1
            - name: EMBEDDING_BASE_URL
              value: http://litellm.catalyst-llm.svc.cluster.local:4000/v1
          volumeMounts:
            - name: metube-downloads
              mountPath: /data/metube
              readOnly: true
            - name: tubesync-downloads
              mountPath: /data/tubesync
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: metube-downloads
          persistentVolumeClaim:
            claimName: metube-downloads
        - name: tubesync-downloads
          persistentVolumeClaim:
            claimName: tubesync-downloads
