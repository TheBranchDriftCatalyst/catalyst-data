[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-exgraph"
version = "0.1.0"
description = "Generic composable extraction graphs with MCP validation, ensemble support, and full provenance"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "pydantic>=2.9",
    "catalyst-contracts-core",
    "catalyst-llm-contract-mcp",
    "catalyst-langgraph-aio",
    "dagster-io",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_exgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
