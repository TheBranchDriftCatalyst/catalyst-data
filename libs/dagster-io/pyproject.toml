[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-io"
version = "0.2.0"
description = "Shared IO manager, LLM resources, and utilities for Dagster pipelines"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-aws>=0.29",
    "boto3>=1.35",
    "catalyst-contracts-core",
    "catalyst-llm-contract-mcp",
    "catalyst-langgraph-aio",
    "pydantic>=2.9",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[project.optional-dependencies]
huggingface = [
    "langchain-huggingface>=0.3",
    "sentence-transformers>=3.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_io"]
