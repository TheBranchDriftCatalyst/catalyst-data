[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-io"
version = "0.2.0"
description = "Shared IO manager, LLM resources, and utilities for Dagster pipelines"
requires-python = ">=3.15.0"
dependencies = [
    "dagster>=1.13.26",
    "dagster-aws>=0.29.26",
    "boto3>=1.43.114",
    "catalyst-contracts-core",
    # Wave 1, Step 3 (bead llm-g0b): extract_validated() now wraps
    # ExtractionResource.extract_assertions(). The legacy LangGraph
    # driver that lived in dagster_io.extraction has been retired.
    "catalyst-exgraph",
    "pydantic>=2.14.1",
    "langchain-core>=0.3.86",
    "langchain-openai>=0.3.35",
    "langchain-text-splitters>=0.3.11",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    # DuckDB backs the bench audit log (CD-jzkg, Phase 1 dual-write).
    # In-process, no daemon. ~30 MB wheel — fine in dev; bench is dev-only.
    "duckdb>=1.5.6",
]

[project.optional-dependencies]
huggingface = [
    "langchain-huggingface>=0.3.1",
    "sentence-transformers>=3.3",
]
local-embed = [
    "sentence-transformers>=3.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "pyarrow>=17.0",
]
tokencount = [
    "tiktoken>=0.14.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "pyarrow>=17.0",
    # Wave 1 / Step 3 (bead llm-g0b, QA-3): property-based tests over
    # extract_validated + the unified Mention/Assertion re-exports.
    "hypothesis>=6.170.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_io"]

# Wave 1, Step 3 (bead llm-g0b): wire workspace cross-repo paths to the
# canonical catalyst-llm packages. catalyst-contracts-core supplies the
# unified Mention/Assertion/Provenance shapes; catalyst-exgraph supplies
# ExtractionResource (the only extraction path). Editable installs so
# in-repo edits show up without re-installing.
[tool.uv.sources]
catalyst-contracts-core = { path = "../../../catalyst-llm/packages/catalyst-contracts-core", editable = true }
catalyst-exgraph = { path = "../../../catalyst-llm/packages/catalyst-exgraph", editable = true }

