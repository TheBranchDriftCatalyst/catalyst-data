# Local MinIO for dev mode.
#
# Booted by ./Tiltfile (the dev Tiltfile) so `tilt up` brings up the same
# S3 backend the cluster uses, just locally and persistent. Single backend
# everywhere — the bench harness, Dagster IO managers, and the viewer
# FastAPI all hit the same endpoint (http://localhost:9000) in dev and
# prod. The only thing that changes between modes is where that endpoint
# resolves: a local container here, or the cluster's MinIO Operator
# Tenant via Tilt.prod's port-forward.
#
# Volume `.test-output/minio-data/` persists buckets across `tilt down`
# / `tilt up` cycles so dev runs survive restarts.

services:
  minio:
    image: minio/minio:latest
    container_name: catalyst-data-minio-dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./.test-output/minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: ensures the `dagster` bucket exists. Idempotent.
  minio-init:
    image: minio/mc:latest
    container_name: catalyst-data-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio minio123 &&
        mc mb --ignore-existing local/dagster &&
        echo 'bucket dagster ready'
      "

  # Neo4j with APOC + Neosemantics (n10s) plugins — same plugin set as the
  # k8s deployment in k8s/platform/neo4j.yaml. Pinned to 5-community to
  # match prod. Bolt on 7687, HTTP browser on 7474.
  #
  # n10s gives us the RDF-star bridge: when we want to export the assertion
  # graph as Turtle-star for geo-KG interop (GeoSPARQL, KnowWhereGraph),
  # `n10s.rdf.export.cypher()` does it without dual-write.
  #
  # The neo4j-n10s-init service runs the one-time n10s.graphconfig.init()
  # call so RDF operations work. Idempotent.
  neo4j:
    image: neo4j:5-community
    container_name: catalyst-data-neo4j-dev
    ports:
      - "7474:7474"  # Browser / HTTP API
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4j-homelab
      NEO4J_PLUGINS: '["apoc", "n10s"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,n10s.*"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - ./.test-output/neo4j-data:/data
      - ./.test-output/neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j-homelab 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: configures n10s graphconfig. Mirrors the k8s Job at
  # k8s/platform/neo4j-n10s-init.yaml. Safe to re-run.
  neo4j-n10s-init:
    image: neo4j:5-community
    container_name: catalyst-data-neo4j-n10s-init
    depends_on:
      neo4j:
        condition: service_healthy
    # Block-literal (|) so newlines + bash continuations survive YAML parsing.
    # A folded scalar (>) collapses newlines to spaces, which silently breaks
    # multi-line shell scripts (the cypher-shell continuations get joined and
    # the bare 'CREATE CONSTRAINT ...' line is then interpreted as a command).
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo 'Waiting for neo4j Bolt to accept queries...'
        # Tilt's dc_resource dependency only tracks 'container started', not
        # docker-compose's `condition: service_healthy`, so we cannot rely on
        # the upstream healthcheck — retry until Bolt is actually live.
        for i in $(seq 1 60); do
          if cypher-shell -a bolt://neo4j:7687 -u neo4j -p neo4j-homelab 'RETURN 1' >/dev/null 2>&1; then
            echo "Bolt reachable after $$i attempts."
            break
          fi
          sleep 2
        done
        echo 'Running n10s init...'
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p neo4j-homelab \
          'CREATE CONSTRAINT n10s_unique_uri IF NOT EXISTS FOR (r:Resource) REQUIRE r.uri IS UNIQUE;'
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p neo4j-homelab \
          "CALL n10s.graphconfig.init({handleVocabUris: 'IGNORE', handleMultival: 'ARRAY', keepLangTag: true, handleRDFTypes: 'LABELS_AND_NODES'});" \
          || cypher-shell -a bolt://neo4j:7687 -u neo4j -p neo4j-homelab 'CALL n10s.graphconfig.show()' >/dev/null
        echo 'n10s init complete.'
