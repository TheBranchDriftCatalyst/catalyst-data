version: "3"

dotenv: [".env"]

vars:
  CONGRESS_PARTITION: '{{.CONGRESS_PARTITION | default "119-hres-1"}}'

tasks:
  # ── Testing ──────────────────────────────────────────────────────────────

  test:
    desc: Run all unit tests
    cmds:
      - pytest --tb=short --ignore=packages/media-ingest/tests/test_transcription_qa.py

  test:cov:
    desc: "Run all unit tests with coverage; emits coverage.xml at repo root for scripts/repo_stats.ipynb to pick up"
    cmds:
      - >-
        pytest --tb=short
        --ignore=packages/media-ingest/tests/test_transcription_qa.py
        --cov=libs --cov=packages --cov=tests
        --cov-branch
        --cov-report=term-missing
        --cov-report=xml:coverage.xml

  test:congress:
    desc: Run congress-data unit tests
    cmds:
      - pytest packages/congress-data/tests/test_definitions.py -v

  test:media:
    desc: Run media-ingest unit tests
    cmds:
      - pytest packages/media-ingest/tests/ -v --ignore=packages/media-ingest/tests/integration --ignore=packages/media-ingest/tests/test_transcription_qa.py

  # ── Integration Tests ────────────────────────────────────────────────────

  integration:
    desc: Run ALL integration tests (congress bronze+silver + media discovery)
    cmds:
      - task: integration:congress:bronze
      - task: integration:congress:silver

  integration:congress:
    desc: Run full congress integration chain (requires CONGRESS_API_KEY + LLM_API_KEY)
    env:
      DAGSTER_CODE_LOCATION: congress_data
    cmds:
      - pytest packages/congress-data/tests/integration/ -v -s --partition {{.CONGRESS_PARTITION}}

  integration:congress:bronze:
    desc: Run congress bronze tests only (API calls, no LLM)
    env:
      DAGSTER_CODE_LOCATION: congress_data
    cmds:
      - pytest packages/congress-data/tests/integration/ -v -s -k "bronze" --partition {{.CONGRESS_PARTITION}}

  integration:congress:silver:
    desc: Run congress bronze + silver tests (API + transforms, no LLM)
    env:
      DAGSTER_CODE_LOCATION: congress_data
    cmds:
      - pytest packages/congress-data/tests/integration/ -v -s -k "bronze or silver" --partition {{.CONGRESS_PARTITION}}

  integration:congress:full:
    desc: Run full congress pipeline including LLM (requires LLM_API_KEY)
    env:
      DAGSTER_CODE_LOCATION: congress_data
    cmds:
      - pytest packages/congress-data/tests/integration/ -v -s --partition {{.CONGRESS_PARTITION}}

  integration:media:
    desc: Run media-ingest integration tests
    env:
      DAGSTER_CODE_LOCATION: media_ingest
    cmds:
      - pytest packages/media-ingest/tests/integration/ -v -s

  # ── Linting ──────────────────────────────────────────────────────────────

  lint:
    desc: Run all linters
    cmds:
      - task: lint:python
      - task: lint:frontend

  lint:python:
    desc: Run ruff check + format
    cmds:
      - ruff check .
      - ruff format --check .

  lint:fix:
    desc: Auto-fix lint issues
    cmds:
      - ruff check --fix .
      - ruff format .

  lint:frontend:
    desc: Run frontend linters (viewer-ui)
    dir: packages/media-ingest/viewer-ui
    cmds:
      - npm run lint
      - npm run format:check

  # ── Pipeline Operations ──────────────────────────────────────────────────

  dev:
    desc: "Run dagster dev with all 3 code locations using LocalJsonIOManager (mirrors integration test layout — outputs land in .test-output/<domain>/...). Materialize anything in the UI without S3."
    env:
      PYTHONPATH: "packages/media-ingest/src:packages/congress-data/src:packages/open-leaks/src:libs/dagster-io/src:libs/catalyst-contracts-core/src:libs/catalyst-langgraph-aio/src"
      DAGSTER_IO_BACKEND: local
      OTEL_METRICS_EXPORTER: none
      OTEL_TRACES_EXPORTER: none
    cmds:
      - dagster dev -m media_ingest -m congress_data -m open_leaks {{.CLI_ARGS}}

  dagster:materialize:congress:
    desc: Kick off congress discovery + sensor pipeline
    cmds:
      - |
        curl -s "http://dagster.talos00/graphql" -X POST -H "Content-Type: application/json" \
          -d '{"query":"mutation { launchRun(executionParams: { selector: { repositoryLocationName: \"congress_data\", repositoryName: \"__repository__\", jobName: \"bills_discovery_job\" }, runConfigData: {} }) { __typename ... on LaunchRunSuccess { run { runId } } } }"}' | python3 -c "import json,sys; print('Bills:', json.load(sys.stdin)['data']['launchRun']['run']['runId'][:12])"
      - |
        curl -s "http://dagster.talos00/graphql" -X POST -H "Content-Type: application/json" \
          -d '{"query":"mutation { launchRun(executionParams: { selector: { repositoryLocationName: \"congress_data\", repositoryName: \"__repository__\", jobName: \"members_discovery_job\" }, runConfigData: {} }) { __typename ... on LaunchRunSuccess { run { runId } } } }"}' | python3 -c "import json,sys; print('Members:', json.load(sys.stdin)['data']['launchRun']['run']['runId'][:12])"

  dagster:status:
    desc: Show current Dagster run status
    cmds:
      - |
        curl -s "http://dagster.talos00/graphql" -X POST -H "Content-Type: application/json" \
          -d '{"query":"{ runsOrError(filter:{statuses:[SUCCESS,FAILURE,STARTED,QUEUED]}, limit:20) { __typename ... on Runs { results { status tags { key value } } } } }"}' | python3 -c "
        import json,sys
        from collections import Counter
        runs = json.load(sys.stdin)['data']['runsOrError']['results']
        bill = [r for r in runs if any(t['value']=='congress_bill_sensor' for t in r['tags'] if t['key']=='dagster/sensor_name')]
        member = [r for r in runs if any(t['value']=='congress_member_sensor' for t in r['tags'] if t['key']=='dagster/sensor_name')]
        print(f'Bills:   {dict(Counter(r[\"status\"] for r in bill))}')
        print(f'Members: {dict(Counter(r[\"status\"] for r in member))}')
        "

  dagster:kill:
    desc: Cancel all active Dagster runs
    cmds:
      - |
        curl -s "http://dagster.talos00/graphql" -X POST -H "Content-Type: application/json" \
          -d '{"query":"{ runsOrError(filter:{statuses:[QUEUED,STARTED,STARTING]}, limit:500) { __typename ... on Runs { results { runId } } } }"}' | python3 -c "
        import json,sys,urllib.request
        runs = json.load(sys.stdin)['data']['runsOrError']['results']
        for r in runs:
            try:
                req = urllib.request.Request('http://dagster.talos00/graphql',
                    data=json.dumps({'query':'mutation{terminateRun(runId:\"'+r['runId']+'\"){__typename}}'}).encode(),
                    headers={'Content-Type':'application/json'})
                urllib.request.urlopen(req)
            except: pass
        print(f'Killed {len(runs)} runs')
        "

  # ── Benchmark ────────────────────────────────────────────────────────────

  bench:
    desc: "Full benchmark methodology: run models → ground truth → F1 report → viewer"
    env:
      PYTHONPATH: "."
      EXGRAPH_ENABLED: "true"
    cmds:
      - python tests/benchmark_harness.py --full --regen --audit-log {{.CLI_ARGS}}

  bench:run:
    desc: "Run extraction benchmarks (skip ground truth regen)"
    env:
      PYTHONPATH: "."
      EXGRAPH_ENABLED: "true"
    cmds:
      - python tests/benchmark_harness.py --regen --audit-log {{.CLI_ARGS}}

  bench:ground-truth:
    desc: "Generate ensemble consensus ground truth from existing cached artifacts"
    env:
      PYTHONPATH: "."
    cmds:
      - python tests/benchmark_harness.py --ensemble-gt {{.CLI_ARGS}}

  bench:report:
    desc: "Regenerate benchmark report with F1 scores (needs ground truth)"
    env:
      PYTHONPATH: "."
      EXGRAPH_ENABLED: "true"
    cmds:
      - python tests/benchmark_harness.py --audit-log {{.CLI_ARGS}}

  bench:view:
    desc: "Start benchmark viewer SPA"
    dir: packages/media-ingest/viewer-ui
    cmds:
      - echo "Opening http://localhost:5173/viewer/benchmarks"
      - npm run dev

  bench:pipeline:warm:
    desc: "Pre-warm the audio pipeline cache (transcription + diarization) on the demo video. Run before bench so the harness's captured subprocess doesn't hide the slow Whisper/pyannote work."
    env:
      PYTHONPATH: "."
      DAGSTER_CODE_LOCATION: media_ingest
    cmds:
      - |
        echo ""
        echo "==============================================================="
        echo "  Audio pipeline pre-warmup"
        echo "  Backend: ${WHISPER_BACKEND:-faster-whisper}  Model: ${WHISPER_MODEL:-base}"
        echo "  Set WHISPER_BACKEND=mlx-whisper for Metal (Apple Silicon)"
        echo "==============================================================="
        pytest packages/media-ingest/tests/integration/test_pipeline_integration.py::test_transcription_produces_segments packages/media-ingest/tests/integration/test_pipeline_integration.py::test_diarization_finds_speakers -v -s

  bench:fixtures:regen:
    desc: "Regenerate per-video audio cache (transcription + diarization) for every video in packages/media-ingest/tests/fixtures/audio_manifest.yaml. Same code path as production, results land in pipeline-cache/<doc_id>/ subdirs."
    env:
      PYTHONPATH: "."
    cmds:
      - |
        echo ""
        echo "==============================================================="
        echo "  Multi-video audio fixture regen"
        echo "  Backend: ${WHISPER_BACKEND:-faster-whisper}  Model: ${WHISPER_MODEL:-base}"
        echo "  HF_TOKEN: $([ -n "$HF_TOKEN" ] && echo "set" || echo "MISSING (diarization will fail — set HF_TOKEN)")"
        echo "==============================================================="
        python scripts/regen_audio_fixtures.py {{.CLI_ARGS}}

  bench:chunks:regen:
    desc: "Materialize the production *_chunks Dagster assets across all 3 domains via LocalJsonIOManager. Output lands at .test-output/<domain>/<layer>/.../*_chunks/<partition>/data.jsonl — same medallion paths MinioIOManager writes in prod. Per-domain targets: bench:chunks:regen:{media,congress,leaks}."
    cmds:
      - task: bench:chunks:regen:media
      - task: bench:chunks:regen:congress
      - task: bench:chunks:regen:leaks

  bench:chunks:regen:media:
    desc: "Materialize media_chunks for every video in audio_manifest.yaml. Pre-seeds segment_merge from cached diarization (CPU-only, no GPU re-transcription)."
    env:
      PYTHONPATH: "."
      DAGSTER_CODE_LOCATION: media_ingest
    cmds:
      - pytest packages/media-ingest/tests/integration/test_chunks_cpu.py -v -s {{.CLI_ARGS}}

  bench:chunks:regen:congress:
    desc: "Materialize bill_chunks for every entry in packages/congress-data/tests/fixtures/bill_manifest.yaml. Iterates the full 30-bill manifest via TestManifestSweep, runs the full bronze→silver chain per partition. Requires CONGRESS_API_KEY (live API)."
    env:
      PYTHONPATH: "."
      DAGSTER_CODE_LOCATION: congress_data
    cmds:
      - pytest packages/congress-data/tests/integration/test_pipeline.py::TestManifestSweep -v -s {{.CLI_ARGS}}

  bench:chunks:regen:leaks:
    desc: "Materialize leak_chunks (unpartitioned, deterministic — no creds required)."
    env:
      PYTHONPATH: "."
      DAGSTER_CODE_LOCATION: open_leaks
    cmds:
      - pytest packages/open-leaks/tests/integration/test_chunks.py -v -s {{.CLI_ARGS}}

  bench:clean:
    desc: "Clean benchmark artifacts (standard tier: extractions + GT + runs + reports)"
    env:
      PYTHONPATH: "."
    cmds:
      - |
        python -c "from tests.shared.store import BenchmarkStore; r = BenchmarkStore().clean_all('standard'); print(f'Cleaned: {r}')"

  bench:clean:extractions:
    desc: "Clean only extraction artifacts (keep GT, runs, pipeline cache)"
    env:
      PYTHONPATH: "."
    cmds:
      - python -c "from tests.shared.store import BenchmarkStore; n = BenchmarkStore().clean_extractions(); print(f'Deleted {n} extraction files')"

  bench:clean:runs:
    desc: "Clean timestamped benchmark runs (keep pipeline cache + GT)"
    env:
      PYTHONPATH: "."
    cmds:
      - python -c "from tests.shared.store import BenchmarkStore; n = BenchmarkStore().clean_runs(); print(f'Deleted {n} runs')"

  bench:clean:pipeline:
    desc: "Clean pipeline cache (transcription, diarization, etc.) — EXPENSIVE to regenerate!"
    env:
      PYTHONPATH: "."
    cmds:
      - python -c "from tests.shared.store import BenchmarkStore; n = BenchmarkStore().clean_pipeline_cache(); print(f'Deleted {n} pipeline cache files')"

  bench:clean:all:
    desc: "Nuclear clean — everything except true fixtures (tests/fixtures/)"
    env:
      PYTHONPATH: "."
    cmds:
      - |
        python -c "from tests.shared.store import BenchmarkStore; r = BenchmarkStore().clean_all('nuclear'); print(f'Cleaned: {r}')"

  # ── Dev ──────────────────────────────────────────────────────────────────

  stats:
    desc: "Open the repo-stats notebook (AI-bloat detection + churn graphs)"
    cmds:
      - jupyter lab scripts/repo_stats.ipynb

  stats:run:
    desc: "Execute the repo-stats notebook headlessly and write the rendered copy to /tmp"
    cmds:
      - jupyter nbconvert --to notebook --execute scripts/repo_stats.ipynb --output /tmp/repo_stats_executed.ipynb

  dev:congress:
    desc: Run congress-data code server locally
    env:
      DAGSTER_CODE_LOCATION: congress_data
    cmds:
      - dagster dev -m congress_data

  dev:media:
    desc: Run media-ingest code server locally
    env:
      DAGSTER_CODE_LOCATION: media_ingest
    cmds:
      - dagster dev -m media_ingest

  dev:viewer:
    desc: Run media viewer locally against cluster MinIO data
    env:
      DAGSTER_CODE_LOCATION: media_ingest
      DAGSTER_S3_ENDPOINT_URL: http://minio.talos00
      DAGSTER_S3_ACCESS_KEY: minio
      DAGSTER_S3_SECRET_KEY: minio123
      DAGSTER_S3_BUCKET: catalyst-data
    cmds:
      - |
        cd packages/media-ingest/viewer-ui && npm run dev &
        VIEWER_PID=$!
        echo "Viewer UI: http://localhost:5173/viewer/"
        python -c "
        import uvicorn
        from media_ingest.viewer.app import create_viewer_app
        uvicorn.run(create_viewer_app(), host='0.0.0.0', port=8080)
        "
        kill $VIEWER_PID 2>/dev/null
